<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Data Keeper – Entry</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">✦ DataVault</div>
    <div class="nav-links">
      <a href="index.html" class="active"><i class="fas fa-plus-circle"></i> Data Entry</a>
      <a href="view.html"><i class="fas fa-table"></i> View Data</a>
    </div>
  </nav>

  <!-- Main Form Card -->
  <div class="glass-card" style="max-width: 900px; margin: 0 auto;">
    <h2>📝 New Entry</h2>
    
    <!-- Category Selector -->
    <div class="form-group">
      <label>Category</label>
      <select id="categorySelect">
        <option value="items">Items Details</option>
        <option value="samples">Sample Details</option>
        <option value="cleaning">Cleaning Details</option>
        <option value="persons">Person Details (Absent)</option>
      </select>
    </div>

    <!-- Dynamic Form Container -->
    <div id="dynamicForm"></div>

    <button class="btn" id="saveBtn"><i class="fas fa-cloud-upload-alt"></i> Save to Cloud</button>
    <p id="saveStatus" style="margin-top: 12px; font-weight: 600;"></p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="index.js"></script>
</body>
</html>
